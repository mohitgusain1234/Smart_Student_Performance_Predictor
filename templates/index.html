<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Student Performance Predictor</h1>

            <p class="subtitle">
                Enter student details to predict the final performance.
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form action="/predict" method="POST">

                <div class="input-group">

                    <label>Study Hours</label>

                    <input
                        type="number"
                        name="study_hours"
                        min="0"
                        max="24"
                        step="0.1"
                        placeholder="Example: 6"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Attendance (%)</label>

                    <input
                        type="number"
                        name="attendance"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Example: 85"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Previous Marks (%)</label>

                    <input
                        type="number"
                        name="previous_marks"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Example: 78"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Assignments Score (%)</label>

                    <input
                        type="number"
                        name="assignments_score"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Example: 80"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Sleep Hours</label>

                    <input
                        type="number"
                        name="sleep_hours"
                        min="0"
                        max="24"
                        step="0.1"
                        placeholder="Example: 8"
                        required
                    >

                </div>


                <button type="submit">
                    Predict Performance
                </button>

            </form>

        </div>

    </div>

</body>

</html>
